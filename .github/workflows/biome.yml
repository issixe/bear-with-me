name: Biome

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Biome
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check changed files
        run: npx biome ci --changed --since=origin/main --reporter=github